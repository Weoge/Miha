<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #101010;
        }
        .image {
            position: absolute;
            width: 50%;
            height: 100vh;
            left: 50%;
            transform: translate(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image img {
            top: 50%;
            left: 50%;
            width: auto;
            height: 100vh;
            background-color: #202020;
        }
        .icon {
            animation: rt 2s linear infinite;
        }
        @keyframes rt {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="image">
        <svg class="icon" width="48px" height="48px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2V6M12 18V22M6 12H2M22 12H18M19.0784 19.0784L16.25 16.25M19.0784 4.99994L16.25 7.82837M4.92157 19.0784L7.75 16.25M4.92157 4.99994L7.75 7.82837" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <script>
        const imageContainer = document.querySelector(".image");
        const title = document.querySelector('title')
        async function getData() {
            try {
                const response = await fetch('https://nekos.best/api/v2/neko');
                if (!response.ok) {
                    throw new Error(`HTTP ERROR: ${response.status}`);
                }
                const data = await response.json();
                console.log(data);
                const item = data.results[0];
                imageContainer.innerHTML = `
                    <img src="${item.url}" alt="${item.artist_name}">
                `;
                title.innerHTML = `
                    ${item.artist_name}
                `;
            } catch (error) {
                console.error('ERROR OF FETCH:', error);
                imageContainer.innerHTML = 'ERROR OF LOAD IMAGE :(';
            }
        }
        getData();
    </script>
</body>
</html>
